name: Build and Release MSIX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.1.44.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Version '$version' must be in the form X.X.X.X"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Patch manifest version
        shell: pwsh
        run: |
          $path = "src/MailClient.App/Package.appxmanifest"
          $content = [System.IO.File]::ReadAllText($path)
          $content = $content -replace 'Version="\d+\.\d+\.\d+\.\d+"', 'Version="${{ steps.version.outputs.version }}"'
          [System.IO.File]::WriteAllText($path, $content, (New-Object System.Text.UTF8Encoding($false)))

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Decode signing certificate
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.MSIX_CERT_BASE64 }}")
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", $bytes)

      - name: Restore
        run: msbuild MailClient.sln /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Build and package
        shell: pwsh
        run: >
          msbuild src/MailClient.App/MailClient.App.csproj /t:Build
          /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Never
          /p:UapAppxPackageBuildMode=SideloadOnly /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificateKeyFile=$env:RUNNER_TEMP\cert.pfx
          /p:PackageCertificatePassword=${{ secrets.MSIX_CERT_PASSWORD }}

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP\cert.pfx" -ErrorAction SilentlyContinue

      - name: Locate package folder
        id: pkg
        shell: pwsh
        run: |
          $folder = Get-ChildItem "src/MailClient.App/AppPackages" -Directory |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          echo "path=$($folder.FullName)" >> $env:GITHUB_OUTPUT
          echo "name=$($folder.Name)" >> $env:GITHUB_OUTPUT

      - name: Zip package folder
        shell: pwsh
        run: Compress-Archive -Path "${{ steps.pkg.outputs.path }}\*" -DestinationPath "${{ steps.pkg.outputs.name }}.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.pkg.outputs.name }}.zip
